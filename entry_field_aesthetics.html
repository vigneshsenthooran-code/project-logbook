
<style>
  :root {
    --app-primary: #b4d335;
    --app-bg: #141410;
    --app-card: #0f0f0c;
    --app-ink: #e9edda;
    --app-muted: #8f9680;
    --app-hairline: rgba(233,237,218,0.12);
    --app-surface: #191c12;
  }
  .showcase { padding: 1rem 0; display: flex; flex-direction: column; gap: 2rem; }
  .section-label {
    font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 1rem;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-card {
    background: var(--app-bg); border: 0.5px solid var(--app-hairline);
    border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .field-name {
    font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--app-muted);
  }

  /* 1. Floating label */
  .float-wrap { position: relative; }
  .float-wrap label {
    position: absolute; left: 14px; top: 14px;
    font-size: 14px; color: var(--app-muted);
    pointer-events: none;
    transition: all 180ms ease;
    background: transparent;
  }
  .float-wrap input {
    width: 100%; background: transparent; color: var(--app-ink);
    border: 1px solid var(--app-hairline); border-radius: 8px;
    padding: 20px 14px 8px; font-size: 15px; font-family: inherit;
    outline: none; box-sizing: border-box;
    transition: border-color 180ms ease;
  }
  .float-wrap input:focus { border-color: var(--app-primary); }
  .float-wrap input:focus + label,
  .float-wrap input:not(:placeholder-shown) + label {
    top: 6px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--app-primary);
  }

  /* 2. Bottom bar only */
  .underline-wrap { position: relative; }
  .underline-wrap input {
    width: 100%; background: transparent; color: var(--app-ink);
    border: none; border-bottom: 1px solid var(--app-hairline);
    padding: 10px 0; font-size: 16px; font-family: inherit;
    outline: none; box-sizing: border-box;
  }
  .underline-wrap::after {
    content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 1.5px;
    background: var(--app-primary); transition: width 220ms ease;
  }
  .underline-wrap:focus-within::after { width: 100%; }
  .underline-wrap label {
    display: block; font-size: 11px; font-weight: 500; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--app-muted); margin-bottom: 8px;
  }

  /* 3. Pill with dot */
  .pill-wrap { display: flex; flex-direction: column; gap: 6px; }
  .pill-wrap label { font-size: 12px; color: var(--app-muted); }
  .pill-input-row {
    display: flex; align-items: center; gap: 10px;
    background: rgba(180,211,53,0.06); border: 1px solid rgba(180,211,53,0.2);
    border-radius: 9999px; padding: 10px 16px;
    transition: border-color 180ms ease, background 180ms ease;
  }
  .pill-input-row:focus-within {
    border-color: var(--app-primary); background: rgba(180,211,53,0.1);
  }
  .pill-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--app-primary); flex: none; }
  .pill-input-row input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--app-ink); font-size: 14px; font-family: inherit;
  }

  /* 4. Command / search style */
  .cmd-wrap {
    display: flex; align-items: center; gap: 10px;
    background: var(--app-surface); border: 1px solid var(--app-hairline);
    border-radius: 8px; padding: 12px 16px;
    transition: border-color 180ms ease;
  }
  .cmd-wrap:focus-within { border-color: var(--app-primary); }
  .cmd-icon { color: var(--app-muted); font-size: 16px; flex: none; }
  .cmd-wrap input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--app-ink); font-size: 15px; font-family: inherit;
  }
  .cmd-shortcut {
    font-size: 11px; color: var(--app-muted); border: 1px solid var(--app-hairline);
    border-radius: 4px; padding: 2px 6px; letter-spacing: 0.5px; flex: none;
  }

  /* 5. Left-accent bar */
  .accent-bar-wrap { display: flex; flex-direction: column; gap: 6px; }
  .accent-bar-wrap label { font-size: 12px; color: var(--app-muted); }
  .accent-bar-field {
    display: flex; border-left: 3px solid var(--app-hairline);
    padding-left: 14px; transition: border-color 180ms ease;
  }
  .accent-bar-field:focus-within { border-left-color: var(--app-primary); }
  .accent-bar-field textarea {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--app-ink); font-size: 15px; font-family: inherit;
    resize: none; min-height: 64px; line-height: 1.5;
  }

  /* 6. Brutalist thick border */
  .brutalist-wrap { display: flex; flex-direction: column; gap: 6px; }
  .brutalist-wrap label { font-size: 12px; color: var(--app-muted); }
  .brutalist-field {
    background: transparent; border: 2px solid var(--app-hairline);
    border-radius: 0; padding: 12px 14px;
    position: relative; transition: border-color 180ms ease;
  }
  .brutalist-field:focus-within { border-color: var(--app-ink); }
  .brutalist-corner {
    position: absolute; top: -2px; left: -2px; width: 12px; height: 12px;
    border-top: 2px solid var(--app-primary); border-left: 2px solid var(--app-primary);
  }
  .brutalist-corner-br {
    position: absolute; bottom: -2px; right: -2px; width: 12px; height: 12px;
    border-bottom: 2px solid var(--app-primary); border-right: 2px solid var(--app-primary);
  }
  .brutalist-field textarea {
    width: 100%; background: transparent; border: none; outline: none;
    color: var(--app-ink); font-size: 15px; font-family: inherit;
    resize: none; min-height: 64px; line-height: 1.5; box-sizing: border-box;
  }

  .send-btn {
    margin-top: 1.5rem; font-size: 13px; color: var(--text-muted);
    border: 0.5px solid var(--border); background: transparent; border-radius: var(--radius);
    padding: 8px 14px; cursor: pointer;
  }
  .send-btn:hover { background: var(--surface-1); color: var(--text-primary); }
</style>

<div class="showcase">
  <p class="section-label">Input field aesthetics — your design language</p>
  <div class="grid">

    <div class="field-card">
      <span class="field-name">Floating label</span>
      <div class="float-wrap">
        <input type="text" id="f1" placeholder=" ">
        <label for="f1">Design note</label>
      </div>
    </div>

    <div class="field-card">
      <span class="field-name">Underline + sweep</span>
      <div class="underline-wrap">
        <label for="f2">Design note</label>
        <input type="text" id="f2" placeholder="Start writing…">
      </div>
    </div>

    <div class="field-card">
      <span class="field-name">Pill + accent dot</span>
      <div class="pill-wrap">
        <label>Design note</label>
        <div class="pill-input-row">
          <div class="pill-dot"></div>
          <input type="text" placeholder="Start writing…">
        </div>
      </div>
    </div>

    <div class="field-card">
      <span class="field-name">Command bar</span>
      <div class="cmd-wrap">
        <i class="ti ti-pencil cmd-icon" aria-hidden="true"></i>
        <input type="text" placeholder="File a note, link or image…">
        <span class="cmd-shortcut">⌘↵</span>
      </div>
    </div>

    <div class="field-card">
      <span class="field-name">Left accent bar</span>
      <div class="accent-bar-wrap">
        <label>Design note</label>
        <div class="accent-bar-field">
          <textarea placeholder="Write here — the bar goes chartreuse on focus…"></textarea>
        </div>
      </div>
    </div>

    <div class="field-card">
      <span class="field-name">Corner bracket</span>
      <div class="brutalist-wrap">
        <label>Design note</label>
        <div class="brutalist-field">
          <div class="brutalist-corner"></div>
          <div class="brutalist-corner-br"></div>
          <textarea placeholder="Chartreuse bracket corners, no border-radius…"></textarea>
        </div>
      </div>
    </div>

  </div>
  <button class="send-btn" onclick="sendPrompt('I like the [style name] direction from the input field examples — can you apply it to my EntryComposer?')">Apply one of these to my composer ↗</button>
</div>
